plugins {
    id 'com.android.application'
}

def ps2xApplicationId = project.findProperty('ps2xApplicationId') ?: 'com.ps2x.runner'
def ps2xSourceRoot = project.findProperty('ps2xSourceRoot') ?: file('../..').canonicalPath
def ps2xGeneratedDir = project.findProperty('ps2xGeneratedDir') ?: ''
def ps2xAndroidAbis = (project.findProperty('ps2xAndroidAbis') ?: 'arm64-v8a')
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
def ps2xNativeArguments = [
        "-DPS2X_SOURCE_ROOT=${ps2xSourceRoot.replace('\\', '/')}",
        "-DPS2X_GENERATED_CODE_DIR=${ps2xGeneratedDir.replace('\\', '/')}",
        '-DPS2X_BUILD_ISO_INSPECTOR=OFF',
        '-DPS2X_ENABLE_SCCACHE=OFF',
        '-DPS2X_ENABLE_DEBUG_UI=OFF',
        '-DPS2X_ENABLE_RUNNER_UNITY_BUILD=OFF',
        '-DPS2X_ENABLE_RUNNER_PCH=OFF',
        '-DANDROID_CPP_FEATURES=rtti exceptions'
]

android {
    namespace 'com.ps2x.runner'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        applicationId ps2xApplicationId

        externalNativeBuild {
            cmake {
                arguments(*ps2xNativeArguments)
                targets 'ps2EntryRunner'
            }
        }

        ndk {
            abiFilters(*ps2xAndroidAbis)
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

android.sourceSets.main.assets.srcDirs = ['src/main/assets']
